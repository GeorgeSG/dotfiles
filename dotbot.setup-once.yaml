- shell:
  -
    stdin: true
    stdout: true
    description: Setting Mac OS defaults
    command: >
      if [ "$(uname)" = "Darwin" ]; then
        xcode-select -p &>/dev/null || xcode-select --install
        ./shell/macos_setup.sh
      fi
  -
    command: ./shell/clone.sh
    description: Cloning Git repos
    stdout: true
    quiet: false
